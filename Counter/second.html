<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        h1 {
            color: blueviolet;
            font-size: 60px;
            display: block;
            
        }

        body {
            background-color: cadetblue;
        }
        #display {
            color: blue;
            font-size: 200px;
            display: flex;
            justify-content: center;
           
            font-weight: bold;
            color: cyan;
            text-shadow: 0 0 10px cyan, 0 0 20px blue, 0 0 40px purple;
            }
        

            
        #incrementCounter {
            font-size: 60px;
            
            
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text; 
            background-clip: text; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px; 
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3), 0 0 25px rgba(255, 255, 255, 0.5), 0 0 50px #ff6347; 
            animation: glow 1.5s ease-in-out infinite alternate; 
        }



        
    
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px; 
            margin-top: 20px; 
            
            
        }
        #increase {
            background-color: green;
            font-size: 45px;
            font-family: 'Courier New', monospace; 
            text-transform: uppercase; 
            font-weight: bold;
        }
        #decrease {
            background-color: red;
            font-size: 45px;
            font-family: 'Courier New', monospace; 
            text-transform: uppercase; 
            font-weight: bold;
        }
        #reset {
            background-color: purple;
            font-size: 45px;
            font-family: 'Courier New', monospace; 
            text-transform: uppercase; 
            font-weight: bold;
        }
        .counter {
            position: absolute;
            top: 200px;
            border: 4px solid #333;
            border-radius: 20px;
            width: 600px;
            padding: 40px;
            background-color: aquamarine;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
     }
        .incrementCounter {
            position: absolute;
            top: 700px;
        }
     h1 {
            position: absolute;
            top: 20px;
            font-size: 80px;
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b); 
            -webkit-background-clip: text; 
            background-clip: text; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px; 
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3), 0 0 25px rgba(255, 255, 255, 0.5), 0 0 50px #ff6347; 
            animation: glow 1.5s ease-in-out infinite alternate; 
        }
        h2 {
            position: absolute;
            top: 600px;
            font-size: 40px;
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b); 
            -webkit-background-clip: text; 
            background-clip: text; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px; 
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3), 0 0 25px rgba(255, 255, 255, 0.5), 0 0 50px #ff6347; 
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        #btn-menu{
            float: right;
            font-size: 30px;
            position:relative;
            
            
            
        }
    </style>
</head>
<body>
    
    <div><button id="btn-menu" class="btn btn-info" onclick="Menu()">Back</button></div>
    <div class="counter" id="counter">
        <div class="display" id="display">0</div>
        <div class="buttons">
            
            <button id="decrease" onclick="decrease()">Decrease</button>
            <button id="reset" onclick="reset()">Reset</button>
            <button id="increase" onclick="increase()">Increase</button>
            

        </div>
    </div>
    <div class="incrementCounter" id="incrementCounter">
        <div class="displayCounter" id="displayCounter">1</div>
        <div class="buttonsCounter"></div>
            <button id="increase" onclick="increaseCounter()">+</button>
            <button id="decrease" onclick="decreaseCounter()">-</button>
        
        </div>
    </div>



        
    
    <script>
        let currentNumCounter = 1;
        let currentNum = 0;
        function increase() {
            currentNum += currentNumCounter;
            updateDisplay(currentNum);
        }
        function decrease() {
            currentNum -= currentNumCounter;
            updateDisplay(currentNum);
        }
        function reset() {
            currentNum = 0;
            updateDisplay(currentNum);
        }
        function updateDisplay(value) {
            const display = document.getElementById('display');
            display.textContent = value;
        }
        function updateDisplayCounter(value) {
            const display = document.getElementById('displayCounter');
            display.textContent = value;
        }
        function increaseCounter() {
            currentNumCounter += 1;
            updateDisplayCounter(currentNumCounter);
        }
        function decreaseCounter() {
            currentNumCounter -= 1;
            updateDisplayCounter(currentNumCounter);
        }
        function Menu(){
            window.location.href = "../Website/website.html";
        }
    </script>
    <h1>Counter Baba Pro</h1>
    <h2>Step size</h2>
</body>
</html>
