<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            font-size: 100px;
            color: burlywood;
            position: static;
            top: 15px;
            left: 200px;
        }
        body {
            background-color: green;
        .calculator {
            border: 4px solid #333;
            border-radius: 20px;
            width: 600px;
            padding: 20px;
            background-color: #fff;
            position: relative;
            left: 80px;
            background-color: aquamarine;
        }
        #btn-multiply {
            
            width: 131px;
        }
        #btn-divide {
            width: 131px;
        }
        #btn-clear {
            width: 130px;
        }
        #btn-back {
            width: 265px;
        }
        
        .display {
            color: blue;
            font-size: 60px;
            border: 4px solid brown;
            border-radius: 20px;
            background-color: beige;
        }
        }
        .butttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 40px;
            
            
        }
        .buttons button {
            font-size: 50px;
            padding: 50px;
            background-color: #f1f1f1;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            background-color: cornflowerblue;
            cursor: pointer;
            transform: background-color 0.3;

        }
        .buttons button:hover{
            background-color: grey;
        }


        
    </style>
</head>
<body>

    
    <h1>Pro calculator 300</h1>
    
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button id="btn-1" onclick="appendNumber(1)">1</button>
            <button id="btn-2" onclick="appendNumber(2)">2</button>
            <button id="btn-3" onclick="appendNumber(3)">3</button>
            <button id="btn-plus" onclick="operator_('+')">+</button>

            <button id="btn-4" onclick="appendNumber(4)">4</button>
            <button id="btn-5" onclick="appendNumber(5)">5</button>
            <button id="btn-6" onclick="appendNumber(6)">6</button>
            <button id="btn-multiply" onclick="operator_('*')">*</button>

            <button id="btn-7" onclick="appendNumber(7)">7</button>
            <button id="btn-8" onclick="appendNumber(8)">8</button>
            <button id="btn-9" onclick="appendNumber(9)">9</button>
            <button id="btn-divide" onclick="operator_('/')">/</button>

            <button id="btn-equal" onclick="calculate('=')">=</button>
            <button id="btn-clear" onclick="restart('C')">C</button>
            <button id="btn-back" onclick="back('<-')">Back</button>


    <script>
        let currentInput = '';
        let previousInput = '';
        let operator = '';
        let fullInput = "";

        function back() {
            fullInput = fullInput.slice(0, -1)
            updateDisplay(fullInput);

        }


        function appendNumber(number) {
            fullInput += number
            currentInput += number
            updateDisplay(currentInput);
        
        }
        function restart(){
            fullInput = ""
            currentInput = ''
            previousInput = ''
            operator = ''
            updateDisplay(0);
        }
        function updateDisplay(value) {
            
            const display = document.getElementById('display');
            display.textContent = fullInput;

        }
        function updateDisplayValue(value) {
            
            const display = document.getElementById('display');
            display.textContent = value;
            fullInput = value;
            }
        function operator_(op){
            fullInput += op
            if (currentInput === '') return;
            if (previousInput !== '') {
                
                calculate();
            }
            operator = op;
            previousInput = currentInput;
            currentInput = '';

        }
        function calculate(){
            let result;
            const  prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        alert("Cannot divide by zero!");
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }

            currentInput = result.toString();
            operator = '';
            previousInput = '';
            updateDisplayValue(currentInput);

        }


            


        




    </script>
            


    
    
</body>
</html>
