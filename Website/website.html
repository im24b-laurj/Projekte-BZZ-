<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<style>
    #Menu {
        float: right;
        color: rgb(9, 11, 113);
        position: relative;
        top: -10px;
        padding: 15px;
        right: 10px;
        display: block;

    }
    h1 {
        font-size: 100px;
        color: antiquewhite;
        position: absolute;
        padding: 20px;
        display: flex;
        
        

    }
    .btn {
    width: auto; 
    padding: 10px 15px; 
    text-align: center;
    display: block; 
}
    
    
    .StartButtons {
        margin: 20px;
        position: relative;
        
        
    }

    .MenuButtons{
        position: relative;
        top: 200px;
        left: 100px;
        box-sizing: border-box;
        margin: 20px;
        
        
    }
    
    #MenuInterface{
       
        background-color: rgba(0, 0, 0, 0.491);
        padding: 20px;
        margin: 10px;
        position: relative;
        top: -30px;
        display: none;
        width: 400px;
        float: right;
        line-height: normal;


       


        
    }
    .hidden{
        width: 200px;
        position: relative;
        float: right;
        display: none;
        

    }
    #Back {
        display: none;
        float: right;
        color: rgb(23, 32, 154);
        position: relative;
        top: 0px;
        padding: 15px;
        right: 10px;


    
    }
    
    #SettingsButton{
        position: relative;
        margin: 20px;
        font-size: 26px;
        
    }
    #CounterButton{
        position: relative;
        margin: 20px;
        font-size: 26px;
        
    }



    #CalculatorButton{
        position: relative;
        margin: 20px;
        font-size: 26px;

    }
    #AboutMeButton{
        position: relative;
        margin: 20px;
        font-size: 26px;

    }
    #DiceSimulatorButton{
        position: relative;
        margin: 20px;
        font-size: 26px;

    }



    
    


</style>
    



</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <div class="btn" id="btn"></div>
        <div class="StartButtons" id="StartButtons">
            <button id="Menu" class="btn btn-primary" onclick="OpenMenu(), HideMenuButton(), ShowBackButton() ">Projects</button>
        </div>
        <div class="hidden" id="Hidden"></div>
            <div class="MenuInterface" id="MenuInterface">
                <button type="button" class="btn btn-primary"id="Back" onclick="CloseMenu(), ShowMenuButton()">Close</button>
                
                <div class="MenuButtons" id="MenuButtons"></div>
                    <button id="SettingsButton" class="btn btn-primary">Settings</button>
                    <button id="CounterButton" class="btn btn-primary" onclick="OpenCounter()">Counter</button>
                    <button id="CalculatorButton" class="btn btn-primary" onclick="OpenCalculator()">Calculator</button>
                    <button id="AboutMeButton" class="btn btn-primary" onclick="AboutMe()">About Me</button>
                    <button id="DiceSimulatorButton" class="btn btn-primary" onclick="OpenDiceSimulator()">Dice-Sim</button>
                    
                
                


            </div>
        </div>
    
    <h1>Title</h1>
    <script>
        function OpenMenu() {
            document.getElementById("MenuInterface").style.display = "block";

        }
        
        
        function CloseMenu() {
            document.getElementById("MenuInterface").style.display = "none";
        }
        function HideMenuButton(){
            document.getElementById("Menu").style.display = "none";
        }
        function ShowBackButton(){
            document.getElementById("Back").style.display = "block";

        }
        function ShowMenuButton(){
            document.getElementById("Menu").style.display = "block";

        }
        function OpenCalculator(){
            window.location.href = "../Calculator/calculator.html";
        }
        function OpenCounter(){
            window.location.href = "../Counter/second.html";
    
        }
        function AboutMe(){
            window.location.href = "../AboutMe/index.html";

        }
        function OpenDiceSimulator(){
            window.location.href = "../DiceSimulator/index.html";

        }

        
        


    </script>
 

    
</body>
</html>
