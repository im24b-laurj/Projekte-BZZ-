<body>

        <div class="MenuButtons" id="MenuInterface">

            <button id="Menu1">Calculator</button>
            <button id="Menu1">Counter</button>
            


        </div>
    <h1>Title</h1>
    <script>
        function OpenMenu() {
            document.getElementById("MenuInterface").style.display = "block";

        }
        
        
        function CloseMenu() {
            document.getElementById("MenuInterface").style.display = "none";
        }
        function HideMenuButton(){
            document.getElementById("Menu").style.display = "none";
        }
        function ShowBackButton(){
            document.getElementById("Back").style.display = "block";

        }
        function ShowMenuButton(){
            document.getElementById("Menu").style.display = "block";

        }
        


    </script>
